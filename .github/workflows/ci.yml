name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, check-latest: true }

      - run: go vet ./...

      # The race detector is a compiler instrumentation that requires cgo. It is
      # a test-time tool and has no bearing on the shipped artifact, so cgo is
      # enabled here and nowhere else.
      - name: test with the race detector
        env: { CGO_ENABLED: 1 }
        run: go test ./... -race

      # This is what actually enforces the single-static-binary constraint: if a
      # dependency ever needs cgo, this step fails loudly rather than silently
      # producing a binary that cannot cross-compile.
      - name: the shipped binary must build without cgo
        env: { CGO_ENABLED: 0 }
        run: go build ./...

      # The sanitiser is the boundary between remote text and the terminal, so
      # examples are not enough.
      - name: fuzz the sanitiser
        run: go test ./internal/safe -run=Fuzz -fuzz=FuzzTextIsAlwaysRenderSafe -fuzztime=60s

      - name: known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./cmd/commhub
